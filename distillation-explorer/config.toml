# Distillation run explorer: configuration.
#
# This file is the one place where tags, labels, plausibility ranges and
# thresholds live. Edit it freely; restart the app to pick up changes.
#
# Secrets (the Eflow URL with its SAS signature) do NOT go here. Put them in
# config.local.toml next to this file. That file is git-ignored and any key in
# it overrides the same key here. See config.local.example.toml.

[app]
host = "127.0.0.1"          # localhost only: no remote access, by design
port = 5080
cache_db = "data/cache.sqlite"   # local SQLite: Eflow rows, metrics, coverage
timezone_note = "America/New_York (plant local time, both sources, no conversion)"

# ---------------------------------------------------------------------------
# Process data source
# ---------------------------------------------------------------------------
[process]
# "mssql" = the real FactoryTalk datalog.  "demo" = a synthetic SQLite copy of
# the same schema, generated by `python run.py --make-demo`, for trying the app
# away from the plant network.
backend = "mssql"
view = "FloatTableAll"       # NOT FloatTable: the view unions live + archive

[process.mssql]
server = 'Evera\CD03LOGGER'
database = "tp_datalog"
driver = "ODBC Driver 18 for SQL Server"
# ApplicationIntent=ReadOnly asks SQL Server for a read-only session. The app
# also refuses to send anything that is not a SELECT (see process_db.py).
extra = "Trusted_Connection=yes;TrustServerCertificate=yes;ApplicationIntent=ReadOnly"
timeout_s = 60

[process.demo]
path = "data/demo_datalog.sqlite"

# Gap handling. Samples further apart than this are a hole, not a slow scan:
# charts break the line there, and time-weighted statistics give the sample
# before the hole no more weight than this. Live = 20 s, backfill = 10 s, so
# 120 s tolerates a few missed scans without bridging a real outage.
[process.gaps]
max_gap_s = 120

# ---------------------------------------------------------------------------
# Signals. Every chart, statistic and export reads labels from here.
#
#   role   : what the analysis code looks for. One signal per role per column
#            for pot_temp, vacuum, condenser, temp_sp. Other roles are free text.
#   lo, hi : plausibility range. Anything outside is treated as a dropout and
#            removed BEFORE any aggregation.
#   drop_zero : an exact 0.0 is a comms failure (true for every analog tag).
#               Status tags are false: 0 is a real state there.
#
# MEASURED (Nov 2026): every vacuum transmitter, CD02 and CD03, peaks at about
# 1015-1030 when the column is at atmosphere, which looks like mbar absolute on
# both. The vacuum ceiling is 1100 so leaks and venting are kept, not dropped.
# Units still say "CD02 units" / "CD03 units" until confirmed on the HMI.
#
# ASSUMPTION (process, not code): the ranges below are my guesses from the
# brief, meant to exclude dropouts and nothing else. Check them against what
# the plant really sees. Vacuum lo is just above zero so a deep real vacuum is
# kept and only the exact-zero dropout goes.
# ---------------------------------------------------------------------------

[columns.CD01]
label = "CD01"
signals = []          # no logging set up yet: Eflow fractions only

[columns.CDMOL]
label = "CDMOL"
signals = []

[columns.CD02]
label = "CD02"
# Vacuum excursion band around the fraction median: the widest of
#   vacuum_band_abs, vacuum_band_rel x median, and [metrics] vacuum_band_k x noise.
# PT_101 reads in steps of about 0.35 and normal noise is about +/-0.7, so 2.0
# sits clear of noise. Leaks, pump trips and operator errors in run 190 went
# 5 to 17 above the median.
vacuum_band_abs = 2.0
vacuum_band_rel = 0.0
pot_temp_threshold = 120.0    # minutes-above threshold, degC (assumption)
signals = [
  { tag = 23, name = "IH_TT_101.PV",       label = "Pot temp",        role = "pot_temp",  unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 12, name = "TEMP_CONTROL_SP_CD02", label = "Temp setpoint", role = "temp_sp",   unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 5,  name = "PT_101.PV",          label = "Vacuum",          role = "vacuum",    unit = "CD02 units", lo = 0.001, hi = 1100, drop_zero = true },
  { tag = 6,  name = "PT_102.PV",          label = "Vacuum 2",        role = "vacuum_2",  unit = "CD02 units", lo = 0.001, hi = 1100, drop_zero = true },
  { tag = 2,  name = "TT_107",             label = "Condenser (TT_107)", role = "condenser", unit = "°C", lo = 1, hi = 300, drop_zero = true },
  { tag = 0,  name = "TT_101",             label = "Column TT_101",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 1,  name = "TT_103",             label = "Column TT_103",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 3,  name = "TT_108",             label = "Column TT_108",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 4,  name = "LT_101",             label = "Level LT_101",    role = "level",     unit = "%",  lo = 0.01, hi = 100, drop_zero = true },
  { tag = 11, name = "U_101_STATUS",       label = "Unit status",     role = "status",    unit = "",   lo = 0,    hi = 2,   drop_zero = false },
]

[columns.CD03]
label = "CD03"
vacuum_band_abs = 20.0     # ASSUMPTION: not yet checked against real CD03 data
vacuum_band_rel = 0.0
pot_temp_threshold = 120.0
signals = [
  { tag = 24, name = "IH_TT_001.PV",       label = "Pot temp",        role = "pot_temp",  unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 21, name = "TEMP_CONTROL_SP_CD03", label = "Temp setpoint", role = "temp_sp",   unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 19, name = "PT_001.PV",          label = "Vacuum",          role = "vacuum",    unit = "CD03 units", lo = 0.001, hi = 1100, drop_zero = true },
  { tag = 20, name = "PT_002.PV",          label = "Vacuum 2",        role = "vacuum_2",  unit = "CD03 units", lo = 0.001, hi = 1100, drop_zero = true },
  { tag = 16, name = "TT_007",             label = "Condenser (TT_007)", role = "condenser", unit = "°C", lo = 1, hi = 300, drop_zero = true },
  { tag = 14, name = "TT_001",             label = "Column TT_001",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 15, name = "TT_003",             label = "Column TT_003",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 17, name = "TT_008",             label = "Column TT_008",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 18, name = "TT_009",             label = "Column TT_009",   role = "column",    unit = "°C", lo = 1,    hi = 300, drop_zero = true },
  { tag = 13, name = "LT_001.PV",          label = "Level LT_001",    role = "level",     unit = "%",  lo = 0.01, hi = 100, drop_zero = true },
  { tag = 22, name = "U_001_STATUS",       label = "Unit status",     role = "status",    unit = "",   lo = 0,    hi = 2,   drop_zero = false },
]

# ---------------------------------------------------------------------------
# Derived metrics. ASSUMPTIONS about your process, all adjustable:
# ---------------------------------------------------------------------------
[metrics]
# Steady state: the first moment after which pot temp stays inside a band of
# +/- steady_band_c for at least steady_window_min minutes.
steady_band_c = 1.0
steady_window_min = 20
# Ramp rate: steepest pot-temp slope over any window of this length (degC/h).
ramp_window_min = 15
# Vacuum excursions: an event must be wider than the band for at least
# excursion_min_s; dips back inside for under excursion_merge_s join one event.
vacuum_band_k = 4
excursion_min_s = 60
excursion_merge_s = 120
# Cross-run comparison resamples each fraction onto this many % bins.
profile_bins = 200

# ---------------------------------------------------------------------------
# Eflow (fraction list from Power Automate). Real URL goes in config.local.toml.
# ---------------------------------------------------------------------------
[eflow]
url = ""
# The flow (the same one the label printer uses) only accepts POST, and
# answers one column per call. "{column}" in the body is replaced by each code
# in `columns`, and the rows from every call are combined.
method = "POST"
body = { columnId = "{column}", action = "get" }
columns = ["CD01", "CD02", "CD03", "CDMOL"]
timeout_s = 180
headers = {}
rows_key = "eflowData"
count_key = ""        # if the flow reports its own row count, name the key here
# Field names in the Eflow JSON (SharePoint internal names, as the flow sends
# them). Dates arrive in UTC ("...Z") and are converted to plant time.
[eflow.fields]
run_id = "ID_x002d_fraction"
column = "Coluna"
distillation = "Distillation"
fraction = "Fraction"
lot = "ID_x002d_tambor"
kg = "Weighing_x0028_Kg_x0029_"
start = "Start_x002d_Dateandtime"
end = "End_x002d_Dateandtime"
